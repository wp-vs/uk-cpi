[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-cpi"
version = "0.1.0"
description = "UK CPI and interest rate data tools"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
ib = ["ib_insync>=0.9.86"]
ice = ["playwright>=1.40"]
all = ["ib_insync>=0.9.86", "playwright>=1.40"]

[project.scripts]
sonia-futures = "uk_cpi.sonia_futures:main"
